services:
  postgres:
    image: postgres:16-alpine
    container_name: wydad-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${POSTGRES_USER:-wydad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wydad2024}
    # Pas de port hôte : la base n'est accessible que depuis le réseau Docker interne.
    # Pour un accès manuel : docker exec -it wydad-postgres psql -U wydad -d <db>
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wydad} -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wydad-redis
    # Pas de port hôte : Redis n'est accessible que depuis le réseau Docker interne.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wydad-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@wydad.ma}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    # pgAdmin : accès par tunnel SSH uniquement (ssh -L 5050:localhost:5050),
    # jamais exposé publiquement — le NSG Azure bloque déjà 5050.
    ports:
      - "127.0.0.1:${PGADMIN_HOST_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: wydad-auth-service
    # Pas de port hôte : accessible uniquement via l'api-gateway
    expose:
      - "8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-wydad}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-wydad2024}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET doit être défini dans le fichier .env}
      - ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD:?ADMIN_SEED_PASSWORD doit être défini dans le fichier .env}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # Phase 1 — pièces justificatives KYC sur Cloudinary (mode dégradé si vides)
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      # Secret partagé service-à-service (ex: /api/auth/internal/recipients
      # utilisé par ticket-service pour la génération VIP Phase 2)
      - WYDAD_INTERNAL_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET manquant dans .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8081/actuator/health 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  content-service:
    build:
      context: ./content-service
      dockerfile: Dockerfile
    container_name: wydad-content-service
    expose:
      - "8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/content_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-wydad}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-wydad2024}
      - WYDAD_INTERNAL_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET manquant dans .env}
      - GAMIFICATION_SERVICE_URI=http://gamification-service:8088
      # §16 — matchs du groupe : résolution roster via sports-service
      - SPORTS_SERVICE_URI=http://sports-service:8087
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8082/actuator/health 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: wydad-payment-service
    expose:
      - "8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/payment_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-wydad}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-wydad2024}
      - WYDAD_INTERNAL_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET manquant dans .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8083/actuator/health 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  shop-service:
    build:
      context: ./shop-service
      dockerfile: Dockerfile
    container_name: wydad-shop-service
    expose:
      - "8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shop_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-wydad}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-wydad2024}
      - WYDAD_INTERNAL_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET manquant dans .env}
      - PAYMENT_SERVICE_URI=http://payment-service:8083
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8084/actuator/health 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  ticket-service:
    build:
      context: ./ticket-service
      dockerfile: Dockerfile
    container_name: wydad-ticket-service
    expose:
      - "8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ticket_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-wydad}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-wydad2024}
      - WYDAD_INTERNAL_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET manquant dans .env}
      - PAYMENT_SERVICE_URI=http://payment-service:8083
      # §3/§4/§26 — billets VIP filtrés par discipline+catégorie (roster)
      - SPORTS_SERVICE_URI=http://sports-service:8087
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8085/actuator/health 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: wydad-notification-service
    expose:
      - "8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/notification_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-wydad}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-wydad2024}
      - WYDAD_INTERNAL_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET manquant dans .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8086/actuator/health 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  sports-service:
    build:
      context: ./sports-service
      dockerfile: Dockerfile
    container_name: wydad-sports-service
    expose:
      - "8087"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sports_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-wydad}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-wydad2024}
      # Phase 3 — notifications in-app des convocations (secret interne requis ;
      # l'URI notification-service pointe déjà sur le bon défaut du client)
      - WYDAD_INTERNAL_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET manquant dans .env}
      # §8 — convocations de match : lecture de la fiche match (discipline +
      # catégorie font foi) dans content-service, secret interne requis.
      - CONTENT_SERVICE_URI=http://content-service:8082
      # Phase 3 — médias tactiques stockés sur Cloudinary (mêmes clés que l'auth)
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      # Phase 4 — validation du JWT à la frame STOMP CONNECT (chat de groupe)
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET doit être défini dans le fichier .env}
      # Phase 5 — appels vidéo/vocaux LiveKit (mode stub si vides)
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8087/actuator/health 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  gamification-service:
    build:
      context: ./gamification-service
      dockerfile: Dockerfile
    container_name: wydad-gamification-service
    expose:
      - "8088"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/wydad_gamification
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-wydad}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-wydad2024}
      - WYDAD_INTERNAL_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET manquant dans .env}
      - CONTENT_SERVICE_URI=http://content-service:8082
      - NOTIFICATION_SERVICE_URI=http://notification-service:8086
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8088/actuator/health 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./wydad-frontend
      dockerfile: Dockerfile
    container_name: wydad-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-4200}:80"
    depends_on:
      api-gateway:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: wydad-api-gateway
    # Seule porte d'entrée exposée publiquement
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      - AUTH_SERVICE_URI=http://auth-service:8081
      - CONTENT_SERVICE_URI=http://content-service:8082
      - PAYMENT_SERVICE_URI=http://payment-service:8083
      - SHOP_SERVICE_URI=http://shop-service:8084
      - TICKET_SERVICE_URI=http://ticket-service:8085
      - NOTIFICATION_SERVICE_URI=http://notification-service:8086
      - SPORTS_SERVICE_URI=http://sports-service:8087
      - GAMIFICATION_SERVICE_URI=http://gamification-service:8088
      - ELECTION_SERVICE_URI=http://election-service:8089
      - COMMUNICATION_SERVICE_URI=http://communication-service:8090
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET doit être défini dans le fichier .env}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      auth-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      shop-service:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      sports-service:
        condition: service_healthy
      gamification-service:
        condition: service_healthy
      election-service:
        condition: service_healthy
      communication-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8080/actuator/health 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  election-service:
    build:
      context: ./election-service
      dockerfile: Dockerfile
    container_name: wydad-election-service
    expose:
      - "8089"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/elections_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-wydad}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-wydad2024}
      # Notifications in-app de la publication des résultats (secret interne requis)
      - WYDAD_INTERNAL_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET manquant dans .env}
      - NOTIFICATION_SERVICE_URI=http://notification-service:8086
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8089/actuator/health 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  communication-service:
    build:
      context: ./communication-service
      dockerfile: Dockerfile
    container_name: wydad-communication-service
    expose:
      - "8090"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/communication_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-wydad}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-wydad2024}
      # Secret interne : API roster sports-service + notifications in-app
      - WYDAD_INTERNAL_SECRET=${INTERNAL_SECRET:?INTERNAL_SECRET manquant dans .env}
      # Validation du JWT à la frame STOMP CONNECT (chat de groupe)
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET doit être défini dans le fichier .env}
      - SPORTS_SERVICE_URI=http://sports-service:8087
      - NOTIFICATION_SERVICE_URI=http://notification-service:8086
    depends_on:
      postgres:
        condition: service_healthy
      sports-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8090/actuator/health 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:

networks:
  default:
    name: wydad-network
