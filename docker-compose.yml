services:
  postgres:
    image: postgres:16-alpine
    container_name: wydad-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: wydad
      POSTGRES_PASSWORD: wydad2024
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wydad -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wydad-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wydad-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@wydad.ma
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: wydad-auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=wydad
      - SPRING_DATASOURCE_PASSWORD=wydad2024
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - JWT_SECRET=wydad-secret-key-2024-ne-pas-utiliser-en-production-tres-long-min-256-bits
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8081/actuator/health 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  content-service:
    build:
      context: ./content-service
      dockerfile: Dockerfile
    container_name: wydad-content-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/content_db
      - SPRING_DATASOURCE_USERNAME=wydad
      - SPRING_DATASOURCE_PASSWORD=wydad2024
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8082/actuator/health 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: wydad-payment-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/payment_db
      - SPRING_DATASOURCE_USERNAME=wydad
      - SPRING_DATASOURCE_PASSWORD=wydad2024
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8083/actuator/health 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  shop-service:
    build:
      context: ./shop-service
      dockerfile: Dockerfile
    container_name: wydad-shop-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shop_db
      - SPRING_DATASOURCE_USERNAME=wydad
      - SPRING_DATASOURCE_PASSWORD=wydad2024
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8084/actuator/health 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: wydad-api-gateway
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URI=http://auth-service:8081
      - CONTENT_SERVICE_URI=http://content-service:8082
      - PAYMENT_SERVICE_URI=http://payment-service:8083
      - SHOP_SERVICE_URI=http://shop-service:8084
    depends_on:
      auth-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      shop-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:8080/actuator/health 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: