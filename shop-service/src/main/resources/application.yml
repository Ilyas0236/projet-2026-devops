server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: shop-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/shop_db}
    username: ${SPRING_DATASOURCE_USERNAME:wydad}
    password: ${SPRING_DATASOURCE_PASSWORD:wydad2024}
    driver-class-name: org.postgresql.Driver
    hikari:
      # VM 1 Go RAM : 10 services x pool par defaut (10) sature max_connections=100
      maximum-pool-size: ${HIKARI_MAX_POOL:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

wydad:
  internal-secret: ${WYDAD_INTERNAL_SECRET:}
  payment-service-uri: ${PAYMENT_SERVICE_URI:http://localhost:8083}

logging:
  level:
    com.wydad.digital.shop: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always