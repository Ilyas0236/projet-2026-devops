<div class="space-y-6">
  <div class="flex justify-between items-center">
    <div>
      <h2 class="text-2xl font-display font-bold uppercase tracking-wider text-white">Notifications</h2>
      <p class="text-sm text-gray-400 mt-1">Gérez et envoyez des notifications Push, Email et In-App.</p>
    </div>
    <div class="flex gap-3">
      <button (click)="openModal(false)" class="bg-white/10 hover:bg-white/20 text-white px-4 py-2 font-display font-bold uppercase tracking-wider text-sm transition-colors">
        Envoi Ciblé
      </button>
      <button (click)="openModal(true)" class="bg-wydad-red hover:bg-red-700 text-white px-4 py-2 font-display font-bold uppercase tracking-wider text-sm skew-x-[-10deg] transition-colors">
        <span class="skew-x-[10deg] block">Broadcast Général</span>
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="flex justify-center py-20">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-wydad-red"></div>
  </div>

  <div *ngIf="!loading" class="bg-white/5 border border-white/10 rounded-lg overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-black/50 border-b border-white/10">
          <th class="py-3 px-4 text-xs font-display font-bold text-gray-400 uppercase tracking-wider">Type</th>
          <th class="py-3 px-4 text-xs font-display font-bold text-gray-400 uppercase tracking-wider">Titre</th>
          <th class="py-3 px-4 text-xs font-display font-bold text-gray-400 uppercase tracking-wider">Destinataire (ID)</th>
          <th class="py-3 px-4 text-xs font-display font-bold text-gray-400 uppercase tracking-wider">Statut</th>
          <th class="py-3 px-4 text-xs font-display font-bold text-gray-400 uppercase tracking-wider">Date</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-white/5">
        <tr *ngFor="let item of notifications" class="hover:bg-white/5 transition-colors">
          <td class="py-3 px-4">
            <span class="px-2 py-1 rounded text-xs font-bold"
                  [ngClass]="{
                    'bg-blue-500/20 text-blue-400': item.type === 'PUSH',
                    'bg-purple-500/20 text-purple-400': item.type === 'EMAIL',
                    'bg-gray-500/20 text-gray-400': item.type === 'IN_APP'
                  }">
              {{ item.type }}
            </span>
          </td>
          <td class="py-3 px-4 text-sm text-white font-medium">{{ item.title }}</td>
          <td class="py-3 px-4 text-xs text-gray-400">{{ item.userId || 'Broadcast' }}</td>
          <td class="py-3 px-4">
            <span class="px-2 py-1 rounded text-xs font-bold"
                  [ngClass]="{
                    'bg-green-500/20 text-green-400': item.status === 'SENT' || item.status === 'READ',
                    'bg-yellow-500/20 text-yellow-400': item.status === 'PENDING',
                    'bg-red-500/20 text-red-400': item.status === 'FAILED'
                  }">
              {{ item.status }}
            </span>
          </td>
          <td class="py-3 px-4 text-xs text-gray-400">{{ item.createdAt | date:'short' }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal Envoi -->
  <div *ngIf="showModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
    <div class="bg-zinc-900 border border-white/10 p-6 w-full max-w-lg rounded-lg">
      <h3 class="text-xl font-display font-bold text-white uppercase tracking-wider mb-6">
        {{ isBroadcast ? 'Broadcast Général' : 'Envoi Ciblé' }}
      </h3>
      
      <div class="space-y-4">
        <div *ngIf="!isBroadcast">
          <label class="block text-xs text-gray-400 uppercase mb-1">ID Utilisateur</label>
          <input type="number" [(ngModel)]="currentNotif.userId" class="w-full bg-black border border-white/10 rounded px-3 py-2 text-white">
        </div>
        <div>
          <label class="block text-xs text-gray-400 uppercase mb-1">Type de Notification</label>
          <select [(ngModel)]="currentNotif.type" class="w-full bg-black border border-white/10 rounded px-3 py-2 text-white">
            <option value="IN_APP">In-App (Cloche)</option>
            <option value="PUSH">Push Mobile</option>
            <option value="EMAIL">Email</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 uppercase mb-1">Titre</label>
          <input type="text" [(ngModel)]="currentNotif.title" class="w-full bg-black border border-white/10 rounded px-3 py-2 text-white">
        </div>
        <div>
          <label class="block text-xs text-gray-400 uppercase mb-1">Message</label>
          <textarea [(ngModel)]="currentNotif.message" class="w-full bg-black border border-white/10 rounded px-3 py-2 text-white h-24"></textarea>
        </div>
        <div>
          <label class="block text-xs text-gray-400 uppercase mb-1">Lien de redirection (Optionnel)</label>
          <input type="text" [(ngModel)]="currentNotif.targetUrl" placeholder="/profil/billets" class="w-full bg-black border border-white/10 rounded px-3 py-2 text-white">
        </div>
      </div>
      
      <div class="mt-8 flex justify-end gap-3">
        <button (click)="closeModal()" class="px-4 py-2 text-gray-400 hover:text-white uppercase text-sm font-bold">Annuler</button>
        <button (click)="sendNotification()" class="px-4 py-2 bg-wydad-red text-white uppercase text-sm font-bold">Envoyer</button>
      </div>
    </div>
  </div>
</div>
