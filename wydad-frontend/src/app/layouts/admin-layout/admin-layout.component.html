<!-- admin-layout.component.html -->
<div class="min-h-screen bg-gray-100 flex font-sans">
  
  <!-- Sidebar -->
  <aside class="w-64 bg-wydad-dark text-white flex flex-col fixed h-full shadow-2xl">
    <!-- Admin Brand -->
    <div class="h-20 flex items-center gap-3 px-6 border-b border-white/10">
      <div class="w-10 h-10 rounded-full bg-wydad-red flex items-center justify-center text-white font-display font-bold">W</div>
      <div class="flex flex-col">
        <span class="font-display font-bold uppercase tracking-wider text-sm">Wydad Digital</span>
        <span class="text-[10px] text-gray-400 uppercase tracking-widest">Admin Dashboard</span>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-1">
      <p class="px-2 text-xs font-bold text-gray-500 uppercase tracking-widest mb-2 mt-4">Principal</p>
      <a routerLink="/admin" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
        Vue d'ensemble
      </a>
      <a routerLink="/admin/utilisateurs" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        Utilisateurs
      </a>

      <p class="px-2 text-xs font-bold text-gray-500 uppercase tracking-widest mb-2 mt-8">Modules</p>
      <a routerLink="/admin/actualites" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16c0 1.1.9 2 2 2h12a2 2 0 0 0 2-2V8l-6-6z"></path><path d="M14 3v5h5M16 13H8M16 17H8M10 9H8"></path></svg>
        Actualités
      </a>
      <a routerLink="/admin/matchs" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
        Matchs & Résultats
      </a>
      <a routerLink="/admin/classements" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg>
        Classements
      </a>
      <a routerLink="/admin/boutique" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        Boutique (E-commerce)
      </a>
      <a routerLink="/admin/billetterie" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Billetterie
      </a>
      <a routerLink="/admin/notifications" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        Notifications
      </a>
      <a routerLink="/admin/effectif" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
        Joueurs & Staff
      </a>
      </a>
    </nav>
    
    <!-- Logout -->
    <div class="p-4 border-t border-white/10">
      <button class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-white/5 hover:bg-red-900/50 text-gray-300 hover:text-red-400 rounded transition-colors text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Déconnexion
      </button>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="flex-1 ml-64 flex flex-col min-h-screen">
    
    <!-- Top Header -->
    <header class="h-20 bg-white border-b border-gray-200 flex items-center justify-between px-8 sticky top-0 z-40">
      <div class="flex items-center gap-2 text-gray-500">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" placeholder="Rechercher..." class="border-none focus:ring-0 text-sm w-64 bg-transparent outline-none">
      </div>
      <div class="flex items-center gap-6">
        <button class="relative text-gray-400 hover:text-gray-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-wydad-red rounded-full border-2 border-white"></span>
        </button>
        <div class="flex items-center gap-3 border-l border-gray-200 pl-6">
          <div class="w-8 h-8 rounded-full bg-gray-200 overflow-hidden">
            <img src="https://ui-avatars.com/api/?name=Admin+WAC&background=D32F2F&color=fff" alt="Admin">
          </div>
          <div class="flex flex-col">
            <span class="text-sm font-bold text-gray-800">Admin</span>
            <span class="text-[10px] font-medium text-gray-500">Superviseur</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 p-8">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
