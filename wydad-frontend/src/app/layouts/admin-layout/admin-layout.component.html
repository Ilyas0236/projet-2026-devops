<!-- admin-layout.component.html -->
<div class="min-h-screen bg-surface-0 flex font-sans text-text-primary">
  
  <!-- Sidebar -->
  <aside class="w-64 bg-surface-1 text-text-secondary flex flex-col fixed h-full shadow-2xl border-r border-white/[0.04] z-50">
    <!-- Admin Brand -->
    <div class="h-20 flex items-center gap-3 px-6 border-b border-white/[0.04]">
      <img src="assets/images/logos/wydad-logo.png" alt="Wydad AC" class="wac-logo-3d object-contain" style="width: 40px;">
      <div class="flex flex-col">
        <span class="font-display font-bold uppercase tracking-wider text-sm text-text-primary">Wydad Digital</span>
        <span class="text-[10px] text-text-tertiary uppercase tracking-widest">Administration</span>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-1">
      <p class="px-2 text-[10px] font-bold text-text-tertiary uppercase tracking-widest mb-2 mt-4 font-display">Principal</p>
      <a routerLink="/admin" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium border-r-2 border-wydad-red" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-text-secondary hover:text-text-primary hover:bg-white/[0.02] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
        Dashboard
      </a>
      <a routerLink="/admin/utilisateurs" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium border-r-2 border-wydad-red" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-text-secondary hover:text-text-primary hover:bg-white/[0.02] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        Utilisateurs
      </a>

      <p class="px-2 text-[10px] font-bold text-text-tertiary uppercase tracking-widest mb-2 mt-8 font-display">Modules</p>
      <a routerLink="/admin/actualites" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium border-r-2 border-wydad-red" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-text-secondary hover:text-text-primary hover:bg-white/[0.02] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16c0 1.1.9 2 2 2h12a2 2 0 0 0 2-2V8l-6-6z"></path><path d="M14 3v5h5M16 13H8M16 17H8M10 9H8"></path></svg>
        Actualités
      </a>
      <a routerLink="/admin/matchs" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium border-r-2 border-wydad-red" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-text-secondary hover:text-text-primary hover:bg-white/[0.02] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
        Matchs
      </a>
      <a routerLink="/admin/classements" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium border-r-2 border-wydad-red" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-text-secondary hover:text-text-primary hover:bg-white/[0.02] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg>
        Classements
      </a>
      <a routerLink="/admin/boutique" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium border-r-2 border-wydad-red" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-text-secondary hover:text-text-primary hover:bg-white/[0.02] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        Boutique
      </a>
      <a routerLink="/admin/billetterie" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium border-r-2 border-wydad-red" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-text-secondary hover:text-text-primary hover:bg-white/[0.02] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Billetterie
      </a>
      <a routerLink="/admin/effectif" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium border-r-2 border-wydad-red" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-text-secondary hover:text-text-primary hover:bg-white/[0.02] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
        Effectif
      </a>
      <a routerLink="/admin/notifications" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium border-r-2 border-wydad-red" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-text-secondary hover:text-text-primary hover:bg-white/[0.02] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        Notifications
      </a>
      <a routerLink="/admin/parametres" routerLinkActive="bg-wydad-red/10 text-wydad-red font-medium border-r-2 border-wydad-red" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-text-secondary hover:text-text-primary hover:bg-white/[0.02] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        Paramètres
      </a>
    </nav>
    
    <!-- Logout -->
    <div class="p-4 border-t border-white/[0.04]">
      <button class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-surface-2 hover:bg-wydad-red/10 text-text-secondary hover:text-wydad-red rounded-lg transition-colors text-sm border border-white/[0.04]">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Déconnexion
      </button>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="flex-1 ml-64 flex flex-col min-h-screen bg-surface-0 relative z-10">
    
    <!-- Top Header -->
    <header class="h-20 bg-surface-2/80 backdrop-blur-xl border-b border-white/[0.04] flex items-center justify-between px-8 sticky top-0 z-40">
      <div class="flex items-center gap-2 text-text-tertiary">
        <div class="relative flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" placeholder="Rechercher..." class="border-none focus:ring-1 focus:ring-wydad-red/50 text-sm w-64 bg-surface-3 outline-none text-text-primary placeholder-text-tertiary py-2 pl-9 pr-3 rounded-lg border border-white/[0.04] transition-all">
        </div>
      </div>
      <div class="flex items-center gap-6">
        <button class="relative text-text-secondary hover:text-text-primary transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-wydad-red rounded-full border-2 border-surface-2"></span>
        </button>
        <div class="flex items-center gap-3 border-l border-white/[0.04] pl-6">
          <div class="w-8 h-8 rounded-full bg-surface-3 border border-wydad-red/30 overflow-hidden shadow-[0_0_10px_rgba(220,20,60,0.2)]">
            <img src="https://ui-avatars.com/api/?name=Admin+WAC&background=111&color=fff" alt="Admin">
          </div>
          <div class="flex flex-col">
            <span class="text-sm font-bold text-text-primary">Admin</span>
            <span class="text-[10px] font-medium text-text-tertiary uppercase tracking-wider">Superviseur</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 p-8 zellige-bg">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
