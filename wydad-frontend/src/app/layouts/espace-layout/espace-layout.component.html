<div class="espace-shell">
  <header class="espace-topbar">
    <div class="brand" aria-label="Wydad AC — espace connecté">
      <img src="assets/images/logos/wydad-logo.png" alt="Wydad AC" class="brand-logo">
      <span class="brand-text">
        <span class="brand-club">WYDAD AC</span>
        <span class="brand-espace">{{ espaceLabel }}</span>
      </span>
    </div>

    <div class="topbar-actions">
      <app-notification-bell></app-notification-bell>
      @if (firstName) {
        <span class="hello">Bonjour, {{ firstName }}</span>
      }
      <button class="btn-logout" type="button" (click)="logout()"><span class="btn-site-long">Se déconnecter</span><span class="btn-site-short">Quitter</span></button>
    </div>
  </header>

  <main class="espace-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Trou #3 — modale de confirmation globale pour les ConfirmService.ask()
       utilisés par les dashboards (ex : staff déclarant un joueur INAPTE,
       confirmation d'annonce portée "club", soumission de feuille de match). -->
  <app-confirm-dialog></app-confirm-dialog>
</div>
