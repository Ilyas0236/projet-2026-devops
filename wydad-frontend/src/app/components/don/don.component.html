<div class="min-h-screen bg-paper-1 light-page py-12 px-4">
  <div class="max-w-2xl mx-auto">
    <div class="paper-card rounded-2xl p-8 md:p-10">

      <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-full bg-wydad-red/10 border border-wydad-red/20 mx-auto flex items-center justify-center mb-4">
          <svg class="w-7 h-7 text-wydad-red" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
        <h1 class="text-3xl font-display font-bold text-ink-primary uppercase tracking-wider">Soutenir le Club</h1>
        <p class="text-ink-secondary text-sm mt-2">Votre don contribue directement au développement de l'académie et des sections sportives du Wydad.</p>
      </div>

      <div *ngIf="successMsg" role="status" class="mb-6 p-4 bg-green-100 border border-green-300 text-green-700 rounded-lg text-sm text-center">
        {{ successMsg }}
      </div>
      <div *ngIf="errorMsg" role="alert" class="mb-6 p-4 bg-wydad-red/10 border border-wydad-red/30 text-wydad-red rounded-lg text-sm text-center">
        {{ errorMsg }}
      </div>

      <!-- Type de don -->
      <div class="grid grid-cols-2 gap-3 mb-6">
        <button type="button" (click)="type = 'PONCTUEL'" [ngClass]="type === 'PONCTUEL' ? 'border-wydad-red bg-wydad-red/[0.07] text-wydad-red' : 'border-paper-3 text-ink-secondary hover:border-wydad-red/40'"
                class="p-4 rounded-xl border transition-colors text-sm font-bold uppercase tracking-wide">
          Don ponctuel
        </button>
        <button type="button" (click)="type = 'MENSUEL'" [ngClass]="type === 'MENSUEL' ? 'border-wydad-red bg-wydad-red/[0.07] text-wydad-red' : 'border-paper-3 text-ink-secondary hover:border-wydad-red/40'"
                class="p-4 rounded-xl border transition-colors text-sm font-bold uppercase tracking-wide">
          Don mensuel
        </button>
      </div>

      <!-- Montants prédéfinis -->
      <label for="don-amount" class="block mb-2 text-ink-secondary text-xs uppercase tracking-wider font-semibold">Montant</label>
      <div class="grid grid-cols-4 gap-3 mb-4">
        <button *ngFor="let a of presetAmounts" type="button" (click)="selectAmount(a)"
                [ngClass]="amount === a ? 'border-wydad-red bg-wydad-red/[0.07] text-wydad-red' : 'border-paper-3 text-ink-primary hover:border-wydad-red/40'"
                class="py-3 rounded-lg border transition-colors font-bold">
          {{ a }} MAD
        </button>
      </div>

      <div class="mb-6">
        <input id="don-amount" type="number" [(ngModel)]="amount" min="10" placeholder="Autre montant (min. 10 MAD)" class="paper-input w-full">
      </div>

      <!-- Message -->
      <div class="mb-6">
        <label for="don-message" class="block mb-2 text-ink-secondary text-xs uppercase tracking-wider font-semibold">Message (optionnel)</label>
        <textarea id="don-message" name="donMessage" [(ngModel)]="message" rows="3" placeholder="Laissez un mot d'encouragement..." class="paper-input w-full"></textarea>
      </div>

      <!-- Reçu fiscal -->
      <label class="flex items-center gap-3 mb-8 cursor-pointer">
        <input type="checkbox" [(ngModel)]="recuFiscal" name="recuFiscal" class="w-4 h-4 accent-red-600">
        <span class="text-sm text-ink-secondary">Je souhaite recevoir un reçu fiscal (PDF)</span>
      </label>

      <button type="button" (click)="submit()" [disabled]="loading || amount < 10" class="paper-btn-primary w-full py-4 text-base">
        {{ loading ? 'Traitement...' : 'Faire un don de ' + amount + ' MAD' }}
      </button>

      <p class="text-ink-tertiary text-xs text-center mt-4">
        Connecté en tant que {{ email }}
      </p>
    </div>
  </div>
</div>
