<div class="min-h-screen bg-surface-1 py-12 px-4">
  <div class="max-w-2xl mx-auto">
    <div class="glass rounded-2xl p-8 md:p-10">

      <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-full bg-wydad-red/10 border border-wydad-red/20 mx-auto flex items-center justify-center mb-4 text-3xl">❤️</div>
        <h1 class="text-3xl font-display font-bold text-text-primary uppercase tracking-wider">Soutenir le Club</h1>
        <p class="text-text-secondary text-sm mt-2">Votre don contribue directement au développement de l'académie et des sections sportives du Wydad.</p>
      </div>

      <div *ngIf="successMsg" class="mb-6 p-4 bg-green-500/10 border border-green-500/30 text-green-400 rounded-lg text-sm text-center">
        {{ successMsg }}
      </div>
      <div *ngIf="errorMsg" class="mb-6 p-4 bg-red-500/10 border border-red-500/30 text-red-400 rounded-lg text-sm text-center">
        {{ errorMsg }}
      </div>

      <!-- Type de don -->
      <div class="grid grid-cols-2 gap-3 mb-6">
        <button (click)="type = 'PONCTUEL'" [ngClass]="type === 'PONCTUEL' ? 'border-wydad-red bg-wydad-red/10 text-wydad-red' : 'border-white/10 text-text-secondary hover:border-white/20'"
                class="p-4 rounded-xl border transition-colors text-sm font-bold uppercase tracking-wide">
          Don ponctuel
        </button>
        <button (click)="type = 'MENSUEL'" [ngClass]="type === 'MENSUEL' ? 'border-wydad-red bg-wydad-red/10 text-wydad-red' : 'border-white/10 text-text-secondary hover:border-white/20'"
                class="p-4 rounded-xl border transition-colors text-sm font-bold uppercase tracking-wide">
          Don mensuel
        </button>
      </div>

      <!-- Montants prédéfinis -->
      <label class="wydad-label">Montant</label>
      <div class="grid grid-cols-4 gap-3 mb-4">
        <button *ngFor="let a of presetAmounts" (click)="selectAmount(a)"
                [ngClass]="amount === a ? 'border-wydad-red bg-wydad-red/10 text-wydad-red' : 'border-white/10 text-text-primary hover:border-white/20'"
                class="py-3 rounded-lg border transition-colors font-bold">
          {{ a }} MAD
        </button>
      </div>

      <div class="mb-6">
        <input type="number" [(ngModel)]="amount" min="10" placeholder="Autre montant (min. 10 MAD)" class="wydad-input w-full">
      </div>

      <!-- Message -->
      <div class="mb-6">
        <label class="wydad-label">Message (optionnel)</label>
        <textarea [(ngModel)]="message" rows="3" placeholder="Laissez un mot d'encouragement..." class="wydad-input w-full"></textarea>
      </div>

      <!-- Reçu fiscal -->
      <label class="flex items-center gap-3 mb-8 cursor-pointer">
        <input type="checkbox" [(ngModel)]="recuFiscal" class="w-4 h-4 accent-red-600">
        <span class="text-sm text-text-secondary">Je souhaite recevoir un reçu fiscal (PDF)</span>
      </label>

      <button (click)="submit()" [disabled]="loading || amount < 10" class="wydad-btn-primary w-full py-4 text-base">
        {{ loading ? 'Traitement...' : 'Faire un don de ' + amount + ' MAD' }}
      </button>

      <p class="text-text-tertiary text-xs text-center mt-4">
        Connecté en tant que {{ email }}
      </p>
    </div>
  </div>
</div>
