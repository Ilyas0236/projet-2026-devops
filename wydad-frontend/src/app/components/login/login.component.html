<div class="flex min-h-screen light-page">
  <!-- Left Side (Hero Image) -->
  <div class="hidden lg:flex w-1/2 relative items-center justify-center club-hero">
    <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/40 to-black/60 z-0"></div>
    <div class="relative z-10 text-center px-12 animate-fade-in-up">
      <h1 class="text-9xl font-display text-white font-bold mb-4 opacity-90 drop-shadow-xl">WAC</h1>
      <h2 class="text-3xl font-display text-white uppercase tracking-widest mb-6">Wydad Athletic Club</h2>
      <p class="text-white/80 text-lg max-w-md mx-auto">Rejoignez la famille des Rouges. L'histoire s'écrit avec vous.</p>
    </div>
  </div>

  <!-- Right Side (Form) -->
  <div class="w-full lg:w-1/2 flex items-center justify-center bg-paper-0 p-8 sm:p-12 lg:p-16 relative">
    <div class="w-full max-w-md animate-scale-in">

      <div class="text-center mb-10">
        <h2 class="text-4xl font-display text-ink-primary uppercase tracking-wide mb-2">Connexion</h2>
        <p class="text-ink-secondary">Accédez à votre espace Wydad AC</p>
      </div>

      <div class="paper-card p-8 sm:p-10 rounded-2xl">
        <div class="form-group mb-6">
          <label for="login-email" class="block mb-2 text-ink-secondary text-sm uppercase tracking-wider font-semibold">Email</label>
          <input id="login-email" type="email" class="paper-input w-full rounded-lg px-4 py-3" [(ngModel)]="email" placeholder="donateur@wydad.ma" autocomplete="email">
        </div>

        <div class="form-group mb-8">
          <label for="login-password" class="block mb-2 text-ink-secondary text-sm uppercase tracking-wider font-semibold">Mot de passe</label>
          <input id="login-password" type="password" class="paper-input w-full rounded-lg px-4 py-3" [(ngModel)]="password" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="button" (click)="login()" [disabled]="loading"
                class="paper-btn-primary w-full py-4 text-lg">
          {{ loading ? 'Connexion...' : 'Se connecter' }}
        </button>

        <div *ngIf="error" role="alert" class="mt-6 p-4 bg-wydad-red/[0.07] border border-wydad-red/30 text-wydad-red rounded-lg text-center font-medium animate-fade-in">
          {{ error }}
        </div>
        <div *ngIf="token" role="status" class="mt-6 p-4 bg-success/10 border border-success/25 text-success rounded-lg text-center font-medium animate-fade-in">
          Connecté !
        </div>

        <div class="relative flex items-center justify-center mt-10 mb-8">
          <div class="absolute inset-x-0 h-px bg-paper-3"></div>
          <span class="relative bg-paper-0 px-4 text-ink-tertiary text-sm">Ou</span>
        </div>

        <div class="text-center">
          <p class="text-ink-secondary mb-4">Pas encore de compte ? <a routerLink="/register" class="inline-block text-wydad-red hover:text-wydad-red-dark font-semibold transition-colors uppercase text-sm tracking-wider ml-1">Créer un compte</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
