<!-- WYDAD DIGITAL — ACTUALITÉS (thème clair blanc/rouge)      -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div class="min-h-screen bg-paper-1 light-page text-ink-primary pt-28 pb-24">

  <!-- Header -->
  <div class="container-wydad mb-16 text-center relative">
    <span class="text-wydad-red font-bold tracking-[0.3em] uppercase text-xs mb-3 block relative z-10 animate-fade-in-up" style="animation-delay: 0.1s; opacity: 0;">Inside WAC</span>
    <h1 class="font-display font-black text-hero uppercase tracking-tighter relative z-10 animate-fade-in-up" style="animation-delay: 0.2s; opacity: 0;">
      À la <span class="text-wydad-red">Une</span>
    </h1>
    <p class="text-ink-secondary mt-4 max-w-2xl mx-auto relative z-10 animate-fade-in-up" style="animation-delay: 0.3s; opacity: 0;">
      Toute l'actualité du club : football, basket, handball, volley et plus.
    </p>
  </div>

  <div class="container-wydad">
    <!-- Sport Filters -->
    <div class="flex justify-center gap-3 flex-wrap mb-12 animate-fade-in-up" style="animation-delay: 0.4s; opacity: 0;">
      <button type="button" (click)="filter = 'ALL'"
              class="px-6 py-2.5 rounded-full font-display font-bold uppercase text-xs tracking-wider transition-all duration-300 border"
              [ngClass]="{
                'bg-wydad-red text-white border-wydad-red': filter === 'ALL',
                'bg-white border-paper-3 text-ink-secondary hover:bg-paper-2': filter !== 'ALL'
              }">
        Tous
      </button>
      <button type="button" (click)="filter = 'FOOTBALL'"
              class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full font-display font-bold uppercase text-xs tracking-wider transition-all duration-300 border"
              [ngClass]="{
                'bg-wydad-red text-white border-wydad-red': filter === 'FOOTBALL',
                'bg-white border-paper-3 text-ink-secondary hover:bg-paper-2': filter !== 'FOOTBALL'
              }">
        <svg aria-hidden="true" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l3.8 2.8-1.5 4.4H9.7L8.2 10.3z"/><path d="M12 3v4.5M20.5 9.5l-4.7.8M17.8 18.6l-4.1-3M10.3 15.6l-4.1 3M3.5 9.5l4.7.8"/></svg>
        Football
      </button>
      <button type="button" (click)="filter = 'BASKETBALL'"
              class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full font-display font-bold uppercase text-xs tracking-wider transition-all duration-300 border"
              [ngClass]="{
                'bg-wydad-red text-white border-wydad-red': filter === 'BASKETBALL',
                'bg-white border-paper-3 text-ink-secondary hover:bg-paper-2': filter !== 'BASKETBALL'
              }">
        <svg aria-hidden="true" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M6.2 5.6a9 9 0 010 12.8M17.8 5.6a9 9 0 000 12.8"/></svg>
        Basket
      </button>
      <button type="button" (click)="filter = 'HANDBALL'"
              class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full font-display font-bold uppercase text-xs tracking-wider transition-all duration-300 border"
              [ngClass]="{
                'bg-wydad-red text-white border-wydad-red': filter === 'HANDBALL',
                'bg-white border-paper-3 text-ink-secondary hover:bg-paper-2': filter !== 'HANDBALL'
              }">
        <svg aria-hidden="true" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5 7.5c4 2.5 10 2.5 14 0M5 16.5c4-2.5 10-2.5 14 0"/></svg>
        Hand
      </button>
      <button type="button" (click)="filter = 'VOLLEYBALL'"
              class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full font-display font-bold uppercase text-xs tracking-wider transition-all duration-300 border"
              [ngClass]="{
                'bg-wydad-red text-white border-wydad-red': filter === 'VOLLEYBALL',
                'bg-white border-paper-3 text-ink-secondary hover:bg-paper-2': filter !== 'VOLLEYBALL'
              }">
        <svg aria-hidden="true" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 12c2.5-3 6.5-3.5 9-2M12 12c.5 3.8-1.5 7.2-4 8.6M12 12C11 8.3 12.5 4.7 15 3"/></svg>
        Volley
      </button>
    </div>

    <!-- News Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let article of filteredArticles(); let i = index"
           class="paper-card group rounded-[2rem] overflow-hidden flex flex-col h-full animate-fade-in-up cursor-pointer"
           [routerLink]="['/actualites', article.id]"
           [style.animation-delay]="(0.5 + (i * 0.1)) + 's'" style="opacity: 0;">

        <!-- Image Container -->
        <div class="relative h-64 overflow-hidden">
          <div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-110"
               [style.backgroundImage]="'url(' + (article.imageUrl || 'assets/images/defaults/default-news-1.svg') + ')'">
          </div>
          <div class="absolute inset-0 bg-gradient-to-t from-white via-transparent to-transparent"></div>

          <!-- Category Badge -->
          <div class="absolute top-4 left-4 z-10">
            <span class="bg-wydad-red text-white text-[10px] font-bold uppercase tracking-[0.15em] px-3 py-1.5 rounded-full shadow-sm">
              {{ article.sport }}
            </span>
          </div>
        </div>

        <!-- Content -->
        <div class="p-8 flex flex-col flex-1 relative z-10 bg-white">
          <div class="text-xs text-ink-tertiary mb-3 font-semibold uppercase tracking-wider">
            {{ article.createdAt | date: 'dd MMM yyyy' }}
          </div>

          <h2 class="font-display font-bold text-2xl uppercase tracking-wider text-ink-primary mb-4 leading-tight group-hover:text-wydad-red transition-colors line-clamp-2">
            {{ article.titre }}
          </h2>

          <p class="text-ink-secondary text-sm mb-6 flex-1 line-clamp-3">
            {{ article.contenu }}
          </p>

          <div class="flex items-center justify-between border-t border-paper-3 pt-4 mt-auto">
            <span class="text-xs text-ink-tertiary font-medium">Par <span class="text-ink-primary">{{ article.auteur }}</span></span>
            <!-- Décoratif : la carte entière est un lien (routerLink) -->
            <span aria-hidden="true" class="w-10 h-10 rounded-full border border-paper-3 flex items-center justify-center text-ink-secondary group-hover:bg-wydad-red group-hover:text-white group-hover:border-transparent transition-all">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div *ngIf="filteredArticles().length === 0" class="paper-card rounded-3xl text-center py-24 w-full animate-fade-in-up">
      <div class="w-16 h-16 bg-paper-2 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg aria-hidden="true" class="w-8 h-8 text-ink-tertiary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 12h6m4-1h2m-2 4h2"/></svg>
      </div>
      <p class="text-ink-tertiary font-display text-lg uppercase tracking-wider">Aucune actualité dans cette section.</p>
    </div>
  </div>
</div>
