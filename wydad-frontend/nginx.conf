# Wydad Digital — serveur SPA
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA : toute route inconnue sert index.html (routing Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API : proxifie vers l'api-gateway (config prod = chemins relatifs)
    # Résolution via le DNS interne de Docker au moment de la requête :
    # le conteneur démarre même si l'api-gateway n'est pas encore up.
    # ^~ : priorité du préfixe /api/ sur les regex ci-dessous (sinon une URL
    # d'API terminant par .png/.jpg etc. serait servie comme fichier statique).
    location ^~ /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api-gateway:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets fingerprintes : cache long terme
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html : jamais cache (déploiements)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
