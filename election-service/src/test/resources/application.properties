spring.datasource.url=jdbc:h2:mem:elections_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# L'application.yml principal force le dialecte PostgreSQL ; en test H2 on
# revient au dialecte H2 (sinon INSERT ... RETURNING casse).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
wydad.notification-service-uri=http://localhost:1
wydad.internal-secret=test-secret
