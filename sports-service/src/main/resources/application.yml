server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: sports-service
  servlet:
    multipart:
      # Documents academie (certificat medical, justificatifs) : le controleur
      # accepte 5 Mo — sans cette cle le defaut Boot est 1 Mo et rejetait
      # tout document > 1 Mo avant d'atteindre la validation metier.
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sports_db}
    username: ${SPRING_DATASOURCE_USERNAME:wydad}
    password: ${SPRING_DATASOURCE_PASSWORD:wydad2024}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.wydad.digital.sports: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
