server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: sports-service
  servlet:
    multipart:
      # Phase 3 — médias tactiques (vidéos courtes d'analyse) : 25 Mo.
      # Les documents académie restent limités côté contrôleur (5 Mo).
      max-file-size: 25MB
      max-request-size: 26MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sports_db}
    username: ${SPRING_DATASOURCE_USERNAME:wydad}
    password: ${SPRING_DATASOURCE_PASSWORD:wydad2024}
    hikari:
      # VM 1 Go RAM : 10 services x pool par defaut (10) sature max_connections=100
      maximum-pool-size: ${HIKARI_MAX_POOL:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
  jpa:
    hibernate:
      # V1 — schéma désormais versionné par Flyway (db/migration/) ;
      # Hibernate ne doit plus modifier la structure, seulement valider.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # V1 — activation de Flyway (cohérence avec auth-service et ticket-service).
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.wydad.digital.sports: DEBUG

# Secret partagé des appels internes (notifications, auth, API roster).
# Même nom de variable que les 9 autres services (docker-compose passe
# WYDAD_INTERNAL_SECRET) — un écart de nommage rendait la propriété vide
# et faisait échouer en 403 tous les appels internes roster/chat.
wydad:
  internal-secret: ${WYDAD_INTERNAL_SECRET:}
  # §8 — convocations de match : la fiche match fait foi (content-service)
  content-service-uri: ${CONTENT_SERVICE_URI:http://localhost:8082}

# Phase 3 — médias tactiques (vidéo/photo/PDF) stockés sur Cloudinary.
# Sans clés, MediaStorageService bascule en mode dégradé (référence locale).
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# Phase 5 — appels vidéo/vocaux (LiveKit Cloud, mode dégradé si vides).
livekit:
  url: ${LIVEKIT_URL:}
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
