server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:wydad}
    password: ${SPRING_DATASOURCE_PASSWORD:wydad2024}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

wydad:
  internal-secret: ${WYDAD_INTERNAL_SECRET:}
  # Mock ChariBaaS (carte test 4242...). Assume pour la demo du projet ;
  # mettre MOCK_CARD_PAYMENT=false pour desactiver /card avant une vraie prod.
  mock-card-payment:
    enabled: ${MOCK_CARD_PAYMENT:true}
    # Plafond par transaction (DH) du mock — limite l'exposition en demo.
    max-amount: ${MOCK_CARD_MAX_AMOUNT:5000}

logging:
  level:
    com.wydad.digital.payment: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always