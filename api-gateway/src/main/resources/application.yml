server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Endpoints internes service-a-service : jamais joignables depuis l'exterieur.
        # Doivent preceder les routes des services concernes (la premiere route
        # matchante gagne).
        - id: block-notification-internal
          uri: no://op
          predicates:
            - Path=/api/notification/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        - id: block-auth-internal
          uri: no://op
          predicates:
            - Path=/api/auth/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        - id: block-payment-internal
          uri: no://op
          predicates:
            - Path=/api/payment/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        - id: block-content-internal
          uri: no://op
          predicates:
            - Path=/api/content/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        - id: block-gamification-internal
          uri: no://op
          predicates:
            - Path=/api/gamification/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        # Defense en profondeur : shop/ticket/sports n'exposent aucun endpoint
        # /internal aujourd'hui, mais tout futur endpoint de ce type doit etre
        # bloque par defaut, pas expose par oubli.
        - id: block-shop-internal
          uri: no://op
          predicates:
            - Path=/api/shop/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        - id: block-ticket-internal
          uri: no://op
          predicates:
            - Path=/api/ticket/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        - id: block-sports-internal
          uri: no://op
          predicates:
            - Path=/api/sports/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        # Defense en profondeur : election-service n'expose aucun endpoint
        # /internal ; tout futur endpoint de ce type doit etre bloque ici.
        - id: block-election-internal
          uri: no://op
          predicates:
            - Path=/api/elections/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: content-service
          uri: ${CONTENT_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/content/**
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/payment/**
        - id: shop-service
          uri: ${SHOP_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/shop/**
        - id: ticket-service
          uri: ${TICKET_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/ticket/**
        # Messagerie privée et chat de groupe : migrés de sports-service vers
        # communication-service (audit thématique). Les chemins historiques
        # /api/sports/messaging|team-chat sont conservés pour compatibilité
        # frontend — ces routes DOIVENT précéder la route générique
        # sports-service ci-dessous (première matchante gagne).
        - id: communication-messaging
          uri: ${COMMUNICATION_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/api/sports/messaging/**
        - id: communication-team-chat
          uri: ${COMMUNICATION_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/api/sports/team-chat/**
        # Chat de groupe : upgrade WebSocket/STOMP (SockJS inclus) vers
        # communication-service. L'identité est exigée par frame STOMP
        # CONNECT (JWT validé par le service) ; l'adhésion est revérifiée
        # à chaque envoi.
        - id: communication-websocket
          uri: ${COMMUNICATION_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/ws/team-chat/**
        - id: communication-websocket-root
          uri: ${COMMUNICATION_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/ws/team-chat
        - id: sports-service
          uri: ${SPORTS_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/sports/**
        - id: gamification-service
          uri: ${GAMIFICATION_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/api/gamification/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/notification/**
        # Gouvernance du club : élections du président + sondages (migration
        # depuis sports-service — audit thématique). Résultats publiés publics,
        # vote et administration authentifiés (côté service).
        - id: election-service
          uri: ${ELECTION_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/api/elections/**,/api/polls/**
        # Defense en profondeur : communication-service n'expose aucun endpoint
        # /internal ; tout futur endpoint de ce type doit etre bloque ici.
        - id: block-communication-internal
          uri: no://op
          predicates:
            - Path=/api/communication/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        - id: communication-service
          uri: ${COMMUNICATION_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/api/communication/**

logging:
  level:
    org.springframework.cloud.gateway: INFO

# Actuator : health uniquement, sans detail. L'endpoint 'gateway'
# (lecture/creation de routes a chaud) ne doit JAMAIS etre expose sur
# le port public — il permettrait de contourner le blocage des routes internes.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
