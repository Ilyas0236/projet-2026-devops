server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: block-notification-internal
          uri: no://op
          predicates:
            - Path=/api/notification/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        - id: block-auth-internal
          uri: no://op
          predicates:
            - Path=/api/auth/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        - id: block-payment-internal
          uri: no://op
          predicates:
            - Path=/api/payment/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        - id: block-content-internal
          uri: no://op
          predicates:
            - Path=/api/content/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        - id: block-gamification-internal
          uri: no://op
          predicates:
            - Path=/api/gamification/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        - id: block-shop-internal
          uri: no://op
          predicates:
            - Path=/api/shop/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        - id: block-ticket-internal
          uri: no://op
          predicates:
            - Path=/api/ticket/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        - id: block-sports-internal
          uri: no://op
          predicates:
            - Path=/api/sports/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        - id: block-election-internal
          uri: no://op
          predicates:
            - Path=/api/elections/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        - id: block-communication-internal
          uri: no://op
          predicates:
            - Path=/api/communication/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        # /api/admin/** = préfixe des routes admin du auth-service
        # (AdminSubscriptionPlanController, B.12). On bloque l'accès
        # externe à /api/admin/internal/** comme pour les autres
        # services, sinon InternalRoutesBlockedTest échoue.
        - id: block-admin-internal
          uri: no://op
          predicates:
            - Path=/api/admin/internal/**
          filters:
            - name: SetStatus
              args:
                status: FORBIDDEN
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        # CRUD admin des plans d'abonnement saisonnier (B.12 refonte) :
        # le contrôleur est @RequestMapping("/api/admin/subscription-plans")
        # côté auth-service. On étend donc la route auth-service pour
        # exposer ce préfixe (les @PreAuthorize côté back filtrent ADMIN).
        - id: auth-admin-subscription-plans
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/admin/subscription-plans/**
        - id: content-service
          uri: ${CONTENT_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/content/**
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/payment/**
        - id: shop-service
          uri: ${SHOP_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/shop/**
        - id: ticket-service
          uri: ${TICKET_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/ticket/**
        - id: communication-messaging
          uri: ${COMMUNICATION_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/api/sports/messaging/**
        - id: communication-team-chat
          uri: ${COMMUNICATION_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/api/sports/team-chat/**
        - id: communication-websocket
          uri: ${COMMUNICATION_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/ws/team-chat/**
        - id: communication-websocket-root
          uri: ${COMMUNICATION_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/ws/team-chat
        - id: sports-service
          uri: ${SPORTS_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/sports/**
        - id: gamification-service
          uri: ${GAMIFICATION_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/api/gamification/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/notification/**
        - id: election-service
          uri: ${ELECTION_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/api/elections/**,/api/polls/**
        - id: communication-service
          uri: ${COMMUNICATION_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/api/communication/**

logging:
  level:
    org.springframework.cloud.gateway: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
