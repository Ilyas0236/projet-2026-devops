server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: communication-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/communication_db}
    username: ${SPRING_DATASOURCE_USERNAME:wydad}
    password: ${SPRING_DATASOURCE_PASSWORD:wydad2024}
    hikari:
      # VM 1 Go RAM : 10 services x pool par defaut (10) sature max_connections=100
      maximum-pool-size: ${HIKARI_MAX_POOL:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.wydad.digital.communication: DEBUG

# Secret partagé pour les appels internes (roster sports-service, notifs).
# Même nom de variable que les autres services : docker-compose exporte
# WYDAD_INTERNAL_SECRET — avec ${INTERNAL_SECRET:} la propriété restait
# vide et le chat échouait en 403 côté roster (bug re-test 25/08).
wydad:
  jwt-secret: ${JWT_SECRET:}
  internal-secret: ${WYDAD_INTERNAL_SECRET:}
  notification-service-uri: ${NOTIFICATION_SERVICE_URI:http://notification-service:8086}
  sports-service-uri: ${SPORTS_SERVICE_URI:http://sports-service:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
