server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:wydad}
    password: ${SPRING_DATASOURCE_PASSWORD:wydad2024}
    driver-class-name: org.postgresql.Driver
    hikari:
      # VM 1 Go RAM : 10 services x pool par defaut (10) sature max_connections=100
      maximum-pool-size: ${HIKARI_MAX_POOL:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:wydad-secret-key-2024-ne-pas-utiliser-en-production-tres-long-min-256-bits}
  expiration: 86400000
  refresh-expiration: 604800000

# Phase 1 — pièces justificatives (KYC) stockées sur Cloudinary.
# Sans clés, CloudinaryService bascule en mode dégradé (référence locale).
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 12MB

wydad:
  internal-secret: ${WYDAD_INTERNAL_SECRET:}
  # URIs des services frères (réseau docker interne) — clients internes
  content-service-uri: ${CONTENT_SERVICE_URI:http://content-service:8082}
  sports-service-uri: ${SPORTS_SERVICE_URI:http://sports-service:8087}
  # payment-service tourne sur 8083 dans docker-compose (le client avait un
  # fallback 8085 hérité d'une ancienne config — corrigé pour matcher
  # l'env var injectée par compose).
  services:
    payment-url: ${PAYMENT_SERVICE_URI:http://payment-service:8083}

app:
  otp:
    # Canal de démonstration : GET /api/auth/otp/mock-code renvoie le code OTP.
    # DOIT rester false hors environnement de démonstration local.
    mock-delivery: ${OTP_MOCK_DELIVERY:false}

logging:
  level:
    com.wydad.digital.auth: DEBUG
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

