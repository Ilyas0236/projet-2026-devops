name: CI/CD Wydad Digital

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}/wydad

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Parent POM
        run: mvn -B clean install -N

      - name: Build & Test Auth Service
        run: mvn -B clean package --file auth-service/pom.xml

      - name: Build & Test Content Service
        run: mvn -B clean package --file content-service/pom.xml

      - name: Build & Test API Gateway
        run: mvn -B clean package --file api-gateway/pom.xml

      - name: Build & Test Payment Service
        run: mvn -B clean package --file payment-service/pom.xml

      - name: Build & Test Shop Service
        run: mvn -B clean package --file shop-service/pom.xml

      - name: Build & Test Ticket Service
        run: mvn -B clean package --file ticket-service/pom.xml

      - name: Build & Test Notification Service
        run: mvn -B clean package --file notification-service/pom.xml

      - name: Build & Test Sports Service
        run: mvn -B clean package --file sports-service/pom.xml

      - name: Upload Auth Service JAR
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jar
          path: auth-service/target/auth-service-*.jar

      - name: Upload Content Service JAR
        uses: actions/upload-artifact@v4
        with:
          name: content-service-jar
          path: content-service/target/content-service-*.jar

      - name: Upload API Gateway JAR
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-jar
          path: api-gateway/target/api-gateway-*.jar

      - name: Upload Payment Service JAR
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-jar
          path: payment-service/target/payment-service-*.jar

      - name: Upload Shop Service JAR
        uses: actions/upload-artifact@v4
        with:
          name: shop-service-jar
          path: shop-service/target/shop-service-*.jar

      - name: Upload Ticket Service JAR
        uses: actions/upload-artifact@v4
        with:
          name: ticket-service-jar
          path: ticket-service/target/ticket-service-*.jar

      - name: Upload Notification Service JAR
        uses: actions/upload-artifact@v4
        with:
          name: notification-service-jar
          path: notification-service/target/notification-service-*.jar

      - name: Upload Sports Service JAR
        uses: actions/upload-artifact@v4
        with:
          name: sports-service-jar
          path: sports-service/target/sports-service-*.jar

  docker-auth:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Auth JAR
        uses: actions/download-artifact@v4
        with:
          name: auth-service-jar
          path: auth-service/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          file: ./auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-auth:latest
            ${{ env.IMAGE_PREFIX }}-auth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-content:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Content JAR
        uses: actions/download-artifact@v4
        with:
          name: content-service-jar
          path: content-service/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Content Service
        uses: docker/build-push-action@v5
