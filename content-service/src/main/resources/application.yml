server:
  port: 8082

spring:
  application:
    name: content-service
  datasource:
    url: jdbc:postgresql://localhost:5433/content_db
    username: wydad
    password: wydad2024
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    com.wydad.digital.content: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always