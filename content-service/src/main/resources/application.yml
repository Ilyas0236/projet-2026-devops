server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: content-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/content_db}
    username: ${SPRING_DATASOURCE_USERNAME:wydad}
    password: ${SPRING_DATASOURCE_PASSWORD:wydad2024}
    driver-class-name: org.postgresql.Driver
    hikari:
      # VM 1 Go RAM : 10 services x pool par defaut (10) sature max_connections=100
      maximum-pool-size: ${HIKARI_MAX_POOL:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

wydad:
  internal-secret: ${WYDAD_INTERNAL_SECRET:}
  gamification-service-uri: ${GAMIFICATION_SERVICE_URI:http://localhost:8088}
  sports-service-uri: ${SPORTS_SERVICE_URI:http://localhost:8081}
  notification-service-uri: ${NOTIFICATION_SERVICE_URI:http://notification-service:8086}
  auth-service-uri: ${AUTH_SERVICE_URI:http://auth-service:8081}

logging:
  level:
    com.wydad.digital.content: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always